name: deep-linux

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: read

concurrency:
  group: deep-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deep-linux:
    name: deep-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: deep-cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            deep-cargo-${{ runner.os }}-

      - name: Bootstrap Linux
        run: ./scripts/bootstrap_linux.sh

      - name: Deep Linux validation
        run: just deep-linux
