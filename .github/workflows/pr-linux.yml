name: pr-linux

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-quality:
    name: linux-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Bootstrap Linux
        run: ./scripts/bootstrap_linux.sh

      - name: Setup
        run: just setup

      - name: Required Linux check
        run: just check-linux
