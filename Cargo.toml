[workspace]
members = ["."]
resolver = "2"

[package]
name = "blok"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "SSD-resident inference runtime"

[lib]
path = "src/blok_runtime_library.rs"

[[bin]]
name = "blok"
path = "src/blok_command_line_entrypoint.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
