model:
  hf_repo: moonshotai/Kimi-K2.6
  class: DeepseekV3ForCausalLM
  scope: text_only_native_runtime
  status: experimental_not_numerically_validated

target_hardware:
  gpu: { vendor: NVIDIA, model: RTX 5060 Ti, vram_gb: 16, cuda_capability: 12.0, sm: 120 }
  cpu: { vendor: AMD, model: Ryzen 9 5950X, socket: AM4, pcie: 4.0, memory: DDR4 }
  ram_gb: 48
  storage:
    ugds_primary: { vendor: Samsung, model: 990 EVO Plus, capacity: 1TB, interface: PCIe 4.0 x4 / 5.0 x2 NVMe }
    excluded:
      - { vendor: Kingston, model: SA400S37240G, capacity: 240GB, interface: SATA SSD }
      - { vendor: Seagate, model: ST2000DM008-2FR102, capacity: 2TB, interface: SATA HDD }
  motherboard: { status: unknown_am4, stale_rejected: MSI MAG X870 Tomahawk is AM5 and incompatible with Ryzen 9 5950X }

config:
  layers: 61
  first_k_dense_replace: 1
  hidden_size: 7168
  attention_heads: 64
  q_lora_rank: 1536
  kv_lora_rank: 512
  qk_nope_head_dim: 128
  qk_rope_head_dim: 64
  v_head_dim: 128
  routed_experts: 384
  experts_per_token: 8
  moe_intermediate_size: 2048
  shared_intermediate_size: 18432
  vocab_size: 163840
  rms_norm_eps: 1.0e-05
  routed_scaling_factor: 2.827
  token_ids: { bos: 163584, eos_im_end: 163586, pad: 163839, unk: 163838 }
  rope:
    theta: 50000
    yarn_scaling_factor: 64
    original_max_position_embeddings: 4096
    status: wired_unverified

ugds:
  required: true
  map_env: BLOK_UGDS_MAP
  device_env: BLOK_UGDS_DEVICE
  kv_scratch_base_env: BLOK_KV_UGDS_BASE
  kv_scratch_bytes_env: BLOK_KV_UGDS_BYTES
  rule: model shard ranges and KV scratch range must not overlap

tensor_contract:
  runtime_index_check: scripts/check_kimi_contract.py
  required_sidecars: [manifest.blok, runtime-index.blok, tokenizer.blok]
  routed_expert_i4:
    format: packed_symmetric_i32
    group_size: 32
    decode: q = ((word >> (4 * lane)) & 0xF) - 8
    shapes:
      gate_proj: { weight: [2048, 896], scale: [2048, 224] }
      up_proj: { weight: [2048, 896], scale: [2048, 224] }
      down_proj: { weight: [7168, 256], scale: [7168, 64] }

verification:
  l0_static: just verify-l0
  l1_model_contract: BLOK_MODEL=/path/to/manifest.blok just verify-l1
  l2_cuda_build: just verify-l2
  l3_official_parity: missing
  l4_target_hardware: just verify-l4 plus one-token smoke
  l5_regression: missing
  required_next:
    - official token ids after chat template
    - first-token top-k logits
    - layer attention/MLA trace
    - routed expert dequant/matvec trace
    - exact greedy token ids
