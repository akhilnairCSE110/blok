model:
  hf_repo: moonshotai/Kimi-K2-Thinking
  architecture_class: DeepseekV3ForCausalLM
  auto_map:
    config: configuration_deepseek.DeepseekV3Config
    model: modeling_deepseek.DeepseekV3ForCausalLM
  source_rule: fetch modeling_deepseek.py and configuration_deepseek.py before finalizing kernels

config:
  layers: 61
  first_k_dense_replace: 1
  moe_layer_freq: 1
  hidden_size: 7168
  attention_heads: 64
  num_key_value_heads: 64
  q_lora_rank: 1536
  kv_lora_rank: 512
  qk_nope_head_dim: 128
  qk_rope_head_dim: 64
  v_head_dim: 128
  routed_experts: 384
  experts_per_token: 8
  shared_experts: 1
  moe_intermediate_size: 2048
  scoring_func: sigmoid
  topk_method: noaux_tc
  norm_topk_prob: true
  routed_scaling_factor: 2.827
  rope:
    theta: 50000
    yarn_scaling_factor: 64
    original_max_position_embeddings: 4096
  rms_norm_eps: 1.0e-05
  max_position_embeddings: 262144
  vocab_size: 163840
  token_ids:
    bos: 163584
    eos_im_end: 163586
    pad: 163839
    unk: 163838
  quantization:
    scheme: compressed-tensors
    moe_weights: int4_group_size_32_symmetric
    unquantized:
      - attention
      - shared_expert
      - lm_head

tokenizer:
  class: TikTokenTokenizer
  implementation_file: tokenization_kimi.py
  raw_byte_bpe: false
  special_tokens:
    - "[BOS]"
    - "<|im_end|>"
    - "<|im_user|>"
    - "<|im_assistant|>"
    - "<|im_system|>"
    - "<|im_middle|>"
    - "<|start_header_id|>"
    - "<|end_header_id|>"
    - "<|eot_id|>"
    - "<tool_call>"
    - "</tool_call>"
    - "<tool_response>"
    - "</tool_response>"
    - "<think>"
    - "</think>"
  chat_template: tokenizer_config.json

forward_contract:
  source_file: modeling_deepseek.py
  mla_required:
    - q_down_up_path
    - kv_compressed_path
    - rope_split
    - attention_score_composition
    - cache_contents
    - residual_placement
  moe_required:
    - router_formula
    - bias_correction_before_topk
    - shared_expert_combination
    - expert_tensor_orientation
  router:
    correction_bias_order: add_to_sigmoid_scores_before_topk
    selected_weight_norm: renormalize_to_sum_1_then_scale

required_fetch:
  model_index:
    primary: https://huggingface.co/moonshotai/Kimi-K2-Thinking/blob/main/model.safetensors.index.json
    fallback: https://huggingface.co/moonshotai/Kimi-K2-Instruct-0905/blob/eb1e816d3152c031e2ad9b891c0ffee33aca63f7/model.safetensors.index.json
  modeling_deepseek: https://huggingface.co/moonshotai/Kimi-K2-Thinking/tree/main
  configuration_deepseek: https://huggingface.co/moonshotai/Kimi-K2-Thinking/tree/main
  tokenization_kimi: https://huggingface.co/moonshotai/Kimi-K2-Thinking/tree/main

deliverables:
  tensor_inventory: "name | dtype | shape | shard | offset | nbytes"
  tokenizer_check: "prompt -> [token ids]"
  first_prompt: hello

ugds:
  required: true
  physical_layout_source: local_stack
  map_format: "/absolute/path/model shard byte offset on /dev/ugds_drv0"
  unknowns:
    - byte_offsets_on_ugds_block_device
    - alignment_rules_on_target
    - raw_contiguous_copy_vs_filesystem_files

target_hardware:
  cpu:
    vendor: AMD
    check: lscpu contains AMD
    docs: https://www.amd.com/en/products/processors/ecosystem/ryzen-storage-solutions.html
  gpu:
    vendor: NVIDIA
    check: nvidia-smi detects target GPU and nvcc is installed
    docs: https://www.nvidia.com/Download/index.aspx
  storage:
    vendor: Samsung
    family: EVO
    interface: NVMe preferred for uGDS path
    check: lsblk model/transport shows Samsung/EVO/NVMe and /dev/ugds_drv0 exists
    docs: https://download.semiconductor.samsung.com/resources/data-sheet/samsung_nvme_ssd_990_evo_plus_datasheet_rev.1.0.pdf
  scripts:
    hardware_check: scripts/check_hardware.sh

tensor_contract:
  runtime_index_check: scripts/check_kimi_contract.py
  routed_expert_quantization:
    format: pack-quantized
    dtype: i32
    num_bits: 4
    group_size: 32
    symmetric: true
    zero_point: none
    signed_decode: q = ((word >> (4 * lane)) & 0xF) - 8
    projections:
      gate_proj:
        logical_shape: [2048, 7168]
        packed_shape: [2048, 896]
        scale_shape: [2048, 224]
      up_proj:
        logical_shape: [2048, 7168]
        packed_shape: [2048, 896]
        scale_shape: [2048, 224]
      down_proj:
        logical_shape: [7168, 2048]
        packed_shape: [7168, 256]
        scale_shape: [7168, 64]
  shared_expert:
    dtype: bf16
    gate_proj_shape: [18432, 7168]
    up_proj_shape: [18432, 7168]
    down_proj_shape: [7168, 18432]

verification:
  local:
    - cargo check
    - python3 -m py_compile scripts/model_fetch.py
    - git diff --check
  target:
    - just hardware-check
    - BLOK_MODEL=/path/to/manifest.blok just model-contract
    - just cuda-deep-linux
  optional_tools:
    rust_static:
      - cargo clippy
      - cargo miri
      - cargo geiger
      - cargo audit
      - cargo deny
    rust_dynamic:
      - cargo fuzz
      - cargo mutants
      - proptest
      - loom
    cuda_static:
      - clang-tidy
      - cppcheck
    cuda_dynamic:
      - compute-sanitizer --tool memcheck
      - compute-sanitizer --tool racecheck
      - compute-sanitizer --tool initcheck
      - compute-sanitizer --tool synccheck
      - nsight-compute
      - nsight-systems
