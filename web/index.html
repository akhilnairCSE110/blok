<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Blok</title>
  <style>
    :root { color-scheme: dark; font: 15px/1.5 Inter, ui-sans-serif, system-ui, sans-serif; background: #090a0c; color: #f4f4f0 }
    * { box-sizing: border-box }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 50% -20%, #242a25 0, #090a0c 42%) fixed }
    button, textarea, input { font: inherit }
    button { color: inherit }
    .shell { width: min(900px, 100%); min-height: 100vh; margin: auto; display: grid; grid-template-rows: auto 1fr auto }
    header { display: flex; align-items: center; justify-content: space-between; padding: 22px 24px; border-bottom: 1px solid #ffffff12 }
    .brand { display: flex; align-items: center; gap: 11px; font-weight: 700; letter-spacing: -.02em }
    .mark { width: 25px; height: 25px; border: 1px solid #b7ff8a; border-radius: 7px; box-shadow: inset 0 0 0 5px #b7ff8a22 }
    .status { color: #a9afa8; font-size: 12px }
    .status::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 7px; border-radius: 50%; background: #9ce970 }
    #messages { padding: 32px 24px 160px; overflow: auto }
    .empty { max-width: 600px; margin: 17vh auto 0; text-align: center }
    .empty h1 { margin: 0 0 10px; font: 500 clamp(30px, 6vw, 52px)/1.05 Georgia, serif; letter-spacing: -.04em }
    .empty p { margin: 0; color: #9ba19b }
    .message { max-width: 760px; margin: 0 auto 28px }
    .role { margin-bottom: 8px; color: #9ce970; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase }
    .message.user .role { color: #aab0aa }
    .content { white-space: pre-wrap; overflow-wrap: anywhere }
    .assistant .content { padding: 18px 20px; border: 1px solid #ffffff12; border-radius: 16px; background: #111411 }
    .meta { margin-top: 8px; color: #747a74; font-size: 11px }
    .composer { position: fixed; bottom: 0; left: 50%; width: min(900px, 100%); transform: translateX(-50%); padding: 18px 24px 24px; background: linear-gradient(transparent, #090a0c 23%) }
    .box { padding: 11px; border: 1px solid #ffffff1c; border-radius: 18px; background: #151815; box-shadow: 0 16px 45px #0008 }
    textarea { display: block; width: 100%; min-height: 66px; max-height: 240px; resize: vertical; padding: 7px 8px; border: 0; outline: 0; color: inherit; background: transparent }
    textarea::placeholder { color: #70756f }
    .controls { display: flex; align-items: center; gap: 8px; padding-top: 8px }
    label { display: flex; align-items: center; gap: 7px; color: #8f958f; font-size: 12px }
    input { width: 78px; padding: 7px 8px; border: 1px solid #ffffff17; border-radius: 9px; outline: 0; color: inherit; background: #0e100e }
    button { padding: 8px 12px; border: 1px solid #ffffff17; border-radius: 10px; background: #1b1e1b; cursor: pointer }
    button:hover { border-color: #ffffff35 }
    #send { margin-left: auto; border-color: #b7ff8a; color: #0a0b09; background: #b7ff8a; font-weight: 700 }
    button:disabled { cursor: wait; opacity: .45 }
    .error { color: #ff9b8f }
    @media (max-width: 600px) { header, #messages { padding-left: 16px; padding-right: 16px } .composer { padding: 14px 12px 12px } .status { display: none } }
  </style>
</head>
<body>
  <main class="shell">
    <header><div class="brand"><span class="mark"></span>Blok</div><div class="status">Kimi K2.6 · local</div></header>
    <section id="messages" aria-live="polite"></section>
    <form id="form" class="composer">
      <div class="box">
        <textarea id="prompt" aria-label="Message" placeholder="Ask Kimi to write, reason, or code…" autofocus></textarea>
        <div class="controls">
          <label>Max output <input id="tokens" type="number" min="1" max="10000" value="1000"></label>
          <button id="clear" type="button">Clear</button>
          <button id="send" type="submit">Send</button>
        </div>
      </div>
    </form>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
